services:
  zenhome:
    build: .
    container_name: zenhome
    ports:
      - "8000:8000"
    environment:
      HOME_URL: ${HOME_URL:-http://localhost:8000}
      ZENHOME_NTFY_TOPIC_PREFIX: ${ZENHOME_NTFY_TOPIC_PREFIX:-ZenHome}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_USER: ${NTFY_USER:-}
      NTFY_PASSWORD: ${NTFY_PASSWORD:-}
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s